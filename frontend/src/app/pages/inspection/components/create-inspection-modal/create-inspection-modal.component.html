<app-modal
  [isOpen]="isOpen"
  title="Create Inspection Report"
  subtitle="Perform pre-delivery inspection on an asset for a confirmed booking"
  icon="🔍"
  [showConfirmButton]="false"
  [showCancelButton]="false"
  (closed)="closeModal()"
>
  <form [formGroup]="inspectionForm" (ngSubmit)="onSubmit()" class="space-y-4" dir="ltr">

    <!-- Booking Selection -->
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
        Booking <span class="text-red-500">*</span>
      </label>
      <select
        formControlName="bookingId"
        (change)="onBookingChange()"
        class="w-full px-4 py-2.5 text-sm border rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer transition-all"
        [ngClass]="isFieldInvalid('bookingId') ? 'border-red-300 bg-red-50/20' : 'border-slate-200'"
      >
        <option value="" disabled selected>Select booking...</option>
        <option *ngFor="let booking of filteredBookings" [value]="booking._id">
          {{ booking.bookingCode }} — {{ booking.assetId?.assetName || 'Asset' }} ({{ booking.status }})
        </option>
      </select>
      <p *ngIf="isFieldInvalid('bookingId')" class="text-[11px] text-red-500 mt-1">Booking selection is required.</p>
      <p *ngIf="filteredBookings.length === 0" class="text-[11px] text-amber-600 mt-1">⚠ No bookings available for inspection. Bookings must be in Pending or Confirmed status.</p>
    </div>

    <!-- Asset (auto-filled from booking) -->
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
        Asset <span class="text-red-500">*</span>
      </label>
      <select
        formControlName="assetId"
        class="w-full px-4 py-2.5 text-sm border rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer transition-all"
        [ngClass]="isFieldInvalid('assetId') ? 'border-red-300 bg-red-50/20' : 'border-slate-200'"
      >
        <option value="" disabled selected>Auto-filled from booking or select...</option>
        <option *ngFor="let asset of assets" [value]="asset._id">
          {{ asset.assetCode }} — {{ asset.assetName }}
        </option>
      </select>
      <p *ngIf="isFieldInvalid('assetId')" class="text-[11px] text-red-500 mt-1">Asset is required.</p>
    </div>

    <!-- Inspector Name & Condition Score -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
          Inspector Name <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          formControlName="inspectorName"
          placeholder="Enter inspector full name..."
          class="w-full px-4 py-2.5 text-sm border rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          [ngClass]="isFieldInvalid('inspectorName') ? 'border-red-300 bg-red-50/20' : 'border-slate-200'"
        />
        <p *ngIf="isFieldInvalid('inspectorName')" class="text-[11px] text-red-500 mt-1">Inspector name is required (min 2 chars).</p>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
          Condition Score <span class="text-red-500">*</span>
        </label>
        <div class="flex items-center gap-3">
          <input
            type="range"
            formControlName="conditionScore"
            min="0"
            max="100"
            class="flex-1 h-2 bg-slate-200 rounded-full appearance-none cursor-pointer accent-blue-600"
          />
          <span class="font-mono font-bold text-sm text-slate-900 min-w-[40px] text-right">
            {{ inspectionForm.get('conditionScore')?.value }}
          </span>
        </div>
        <p *ngIf="isFieldInvalid('conditionScore')" class="text-[11px] text-red-500 mt-1">Score must be 0-100.</p>
      </div>
    </div>

    <!-- Status & Photos -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
          Result <span class="text-red-500">*</span>
        </label>
        <select
          formControlName="status"
          class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
        >
          <option value="Passed">✅ Passed — Asset Cleared</option>
          <option value="Failed">❌ Failed — Booking Cancelled</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
          Photos (comma-separated URLs)
        </label>
        <input
          type="text"
          formControlName="photos"
          placeholder="https://img1.jpg, https://img2.jpg"
          class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
    </div>

    <!-- Checklist -->
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">
        Inspection Checklist
      </label>
      <div class="flex flex-wrap gap-3">
        <label *ngFor="let item of ['brakes', 'engine', 'body', 'tires', 'lights']"
          class="flex items-center gap-2 px-4 py-2.5 border rounded-xl cursor-pointer transition-all text-sm font-medium"
          [ngClass]="inspectionForm.get(item)?.value
            ? 'bg-emerald-50 border-emerald-200 text-emerald-700'
            : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'"
        >
          <input type="checkbox" [formControlName]="item" class="hidden" />
          <span>{{ inspectionForm.get(item)?.value ? '✅' : '⬜' }}</span>
          <span class="capitalize">{{ item }}</span>
        </label>
      </div>
    </div>

    <!-- Notes -->
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
        Inspection Notes
      </label>
      <textarea
        formControlName="notes"
        rows="3"
        placeholder="Describe inspection findings, damages, or observations..."
        class="w-full px-4 py-3 text-sm border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
      ></textarea>
    </div>

    <!-- Footer Actions -->
    <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
      <button
        type="button"
        (click)="closeModal()"
        class="px-5 py-2.5 border border-slate-200 text-slate-700 text-sm font-semibold rounded-xl hover:bg-slate-50 transition-colors"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="isSubmitting"
        class="px-6 py-2.5 bg-blue-600 text-white text-sm font-bold rounded-xl hover:bg-blue-700 shadow-md shadow-blue-600/30 flex items-center gap-2 transition-all disabled:opacity-50"
      >
        <span *ngIf="isSubmitting" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        <span>Submit Inspection Report</span>
      </button>
    </div>

  </form>
</app-modal>
