<app-modal
  [isOpen]="isOpen"
  title="Create Inspection Report"
  subtitle="Perform equipment inspection"
  icon="🔍"
  [showConfirmButton]="false"
  [showCancelButton]="false"
  (closed)="closeModal()"
>
  <form
    [formGroup]="inspectionForm"
    (ngSubmit)="onSubmit()"
    class="space-y-4"
    dir="ltr"
  >

    <!-- Inspection Type -->
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
        Inspection Type
      </label>

      <select
        formControlName="inspectionType"
        class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-white"
      >
        <option
          *ngFor="let item of inspectionTypes"
          [value]="item.value"
        >
          {{ item.label }}
        </option>
      </select>
    </div>

    <!-- Booking -->
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
        Booking
      </label>

      <select
        formControlName="bookingId"
        (change)="onBookingChange()"
        class="w-full px-4 py-2.5 text-sm border rounded-xl"
      >
        <option value="">Select Booking</option>

        <option
          *ngFor="let booking of filteredBookings"
          [value]="booking._id"
        >
          {{ booking.bookingCode }}
          -
          {{ booking.assetId?.assetName }}
          ({{ booking.status }})
        </option>
      </select>
    </div>

    <!-- Asset -->
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
        Asset
      </label>

      <select
        formControlName="assetId"
        class="w-full px-4 py-2.5 text-sm border rounded-xl"
      >
        <option value="">Select Asset</option>

        <option
          *ngFor="let asset of assets"
          [value]="asset._id"
        >
          {{ asset.assetCode }} - {{ asset.assetName }}
        </option>
      </select>
    </div>

    <!-- Inspector + Score -->
    <div class="grid grid-cols-2 gap-4">

      <div>
        <label class="block text-xs font-bold mb-1">
          Inspector Name
        </label>

        <input
          type="text"
          formControlName="inspectorName"
          class="w-full px-4 py-2 border rounded-xl"
        />
      </div>

      <div>
        <label class="block text-xs font-bold mb-1">
          Condition Score
        </label>

        <input
          type="range"
          min="0"
          max="100"
          formControlName="conditionScore"
          class="w-full"
        />

        <div class="text-center font-bold mt-1">
          {{ inspectionForm.get('conditionScore')?.value }}
        </div>
      </div>

    </div>

    <!-- Registers -->
    <div class="grid grid-cols-2 gap-4">

      <div>
        <label class="block text-xs font-bold mb-1">
          Tax Register
        </label>

        <input
          type="text"
          formControlName="taxRegister"
          class="w-full px-4 py-2 border rounded-xl"
        />
      </div>

      <div>
        <label class="block text-xs font-bold mb-1">
          Commercial Register
        </label>

        <input
          type="text"
          formControlName="commercialRegister"
          class="w-full px-4 py-2 border rounded-xl"
        />
      </div>

    </div>

    <!-- Status -->
    <div>
      <label class="block text-xs font-bold mb-1">
        Inspection Result
      </label>

      <select
        formControlName="status"
        class="w-full px-4 py-2 border rounded-xl"
      >
        <option
          *ngFor="let s of statuses"
          [value]="s"
        >
          {{ s }}
        </option>
      </select>
    </div>

    <!-- Damage Section -->
    <div
      *ngIf="inspectionForm.get('inspectionType')?.value==='after_return'"
      class="space-y-3 border rounded-xl p-4 bg-red-50"
    >

      <label class="flex items-center gap-2">

        <input
          type="checkbox"
          formControlName="hasDamage"
        >

        Asset has damage

      </label>

      <div *ngIf="inspectionForm.get('hasDamage')?.value">

        <label class="block text-xs font-bold mb-1">
          Damage Level
        </label>

        <select
          formControlName="damageLevel"
          class="w-full px-4 py-2 border rounded-xl"
        >
          <option
            *ngFor="let d of damageLevels"
            [value]="d"
          >
            {{ d }}
          </option>
        </select>

      </div>

      <div *ngIf="inspectionForm.get('hasDamage')?.value">

        <label class="block text-xs font-bold mb-1">
          Estimated Damage Cost
        </label>

        <input
          type="number"
          formControlName="damageCost"
          class="w-full px-4 py-2 border rounded-xl"
        />

      </div>

    </div>

    <!-- Photos -->
    <div>

      <label class="block text-xs font-bold mb-1">
        Photos
      </label>

      <input
        type="text"
        formControlName="photos"
        class="w-full px-4 py-2 border rounded-xl"
        placeholder="url1,url2,url3"
      />

    </div>

    <!-- Checklist -->

    <div>

      <label class="block text-xs font-bold mb-2">
        Checklist
      </label>

      <div class="flex flex-wrap gap-3">

        <label
          *ngFor="let item of ['brakes','engine','body','tires','lights']"
          class="flex items-center gap-2"
        >

          <input
            type="checkbox"
            [formControlName]="item"
          >

          {{ item }}

        </label>

      </div>

    </div>

    <!-- Notes -->

    <div>

      <label class="block text-xs font-bold mb-1">
        Notes
      </label>

      <textarea
        rows="3"
        formControlName="notes"
        class="w-full px-4 py-2 border rounded-xl"
      ></textarea>

    </div>

    <!-- Buttons -->

    <div class="flex justify-end gap-3 pt-4">

      <button
        type="button"
        (click)="closeModal()"
        class="px-5 py-2 border rounded-xl"
      >
        Cancel
      </button>

      <button
  type="button"
  (click)="onSubmit()"
  [disabled]="isSubmitting"
  class="px-6 py-2 bg-blue-600 text-white rounded-xl"
>
  Submit Inspection
</button>

    </div>

  </form>
</app-modal>
