<div class="grid grid-cols-1 md:grid-cols-4 gap-4">
  <!-- Total Inspections -->
  <div
    (click)="onSelectFilter('all')"
    class="bg-white rounded-2xl border p-4 cursor-pointer transition-all duration-200 hover:shadow-md"
    [ngClass]="activeFilter === 'all' ? 'border-blue-500 ring-2 ring-blue-500/20 bg-blue-50/20' : 'border-slate-100 hover:border-slate-200'"
  >
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold text-slate-500">Total Inspections</span>
      <div class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 border border-blue-100 flex items-center justify-center text-sm font-bold">
        📋
      </div>
    </div>
    <div class="flex items-baseline gap-2">
      <span class="text-2xl font-black text-slate-900">{{ stats?.total ?? 0 }}</span>
      <span class="text-xs text-slate-400 font-medium">records total</span>
    </div>
    <div class="mt-3 flex items-center text-[10px] text-blue-700 font-bold">
      <span class="w-1.5 h-1.5 rounded-full bg-blue-500 mr-1.5"></span>
      All inspection records
    </div>
  </div>

  <!-- Passed -->
  <div
    (click)="onSelectFilter('Passed')"
    class="bg-white rounded-2xl border p-4 cursor-pointer transition-all duration-200 hover:shadow-md"
    [ngClass]="activeFilter === 'Passed' ? 'border-emerald-500 ring-2 ring-emerald-500/20 bg-emerald-50/20' : 'border-slate-100 hover:border-slate-200'"
  >
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold text-slate-500">Passed</span>
      <div class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center text-sm font-bold">
        ✅
      </div>
    </div>
    <div class="flex items-baseline gap-2">
      <span class="text-2xl font-black text-slate-900">{{ stats?.passedCount ?? 0 }}</span>
      <span class="text-xs text-slate-400 font-medium">assets cleared</span>
    </div>
    <div class="mt-3 flex items-center text-[10px] text-emerald-700 font-bold">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5"></span>
      Ready for operation
    </div>
  </div>

  <!-- Failed -->
  <div
    (click)="onSelectFilter('Failed')"
    class="bg-white rounded-2xl border p-4 cursor-pointer transition-all duration-200 hover:shadow-md"
    [ngClass]="activeFilter === 'Failed' ? 'border-red-500 ring-2 ring-red-500/20 bg-red-50/20' : 'border-slate-100 hover:border-slate-200'"
  >
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold text-slate-500">Failed</span>
      <div class="w-8 h-8 rounded-xl bg-red-50 text-red-600 border border-red-100 flex items-center justify-center text-sm font-bold">
        ❌
      </div>
    </div>
    <div class="flex items-baseline gap-2">
      <span class="text-2xl font-black text-slate-900">{{ stats?.failedCount ?? 0 }}</span>
      <span class="text-xs text-slate-400 font-medium">require attention</span>
    </div>
    <div class="mt-3 flex items-center text-[10px] text-red-700 font-bold">
      <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse mr-1.5"></span>
      Booking cancelled
    </div>
  </div>

  <!-- Average Score -->
  <div
    class="bg-white rounded-2xl border border-slate-100 p-4 transition-all duration-200 hover:shadow-md"
  >
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold text-slate-500">Avg. Condition Score</span>
      <div class="w-8 h-8 rounded-xl bg-violet-50 text-violet-600 border border-violet-100 flex items-center justify-center text-sm font-bold">
        📊
      </div>
    </div>
    <div class="flex items-baseline gap-2">
      <span class="text-2xl font-black text-slate-900">{{ stats?.averageScore ?? 0 }}</span>
      <span class="text-xs text-slate-400 font-medium">/ 100</span>
    </div>
    <div class="mt-3 w-full bg-slate-100 rounded-full h-2 overflow-hidden">
      <div
        class="h-2 rounded-full transition-all duration-500"
        [ngClass]="{
          'bg-emerald-500': (stats?.averageScore ?? 0) >= 70,
          'bg-amber-500': (stats?.averageScore ?? 0) >= 40 && (stats?.averageScore ?? 0) < 70,
          'bg-red-500': (stats?.averageScore ?? 0) < 40
        }"
        [style.width.%]="stats?.averageScore ?? 0"
      ></div>
    </div>
  </div>
</div>
