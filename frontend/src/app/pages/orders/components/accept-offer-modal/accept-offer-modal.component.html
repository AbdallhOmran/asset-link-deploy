<div *ngIf="isOpen" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-card w-full max-w-md max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-5 border-b border-border">
      <div>
        <h3 class="text-lg font-bold text-text">Start Negotiation</h3>
        <p class="text-xs text-text-muted mt-0.5">
          Confirm your initial terms for {{ order?.assetName }}
        </p>
      </div>
      <button (click)="onCancel()" class="text-text-muted hover:text-text text-lg">&times;</button>
    </div>

    <div class="p-5 space-y-4">
      <p *ngIf="errorMessage" class="text-sm text-danger bg-danger-bg p-2 rounded-md">
        {{ errorMessage }}
      </p>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-text-muted tracking-wide">RENT PRICE *</label>
          <input
            type="number"
            [(ngModel)]="rentPrice"
            min="0"
            class="w-full mt-1 px-3 py-2 text-sm border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30"
          />
        </div>
        <div>
          <label class="text-xs font-semibold text-text-muted tracking-wide">SECURITY DEPOSIT *</label>
          <input
            type="number"
            [(ngModel)]="securityDeposit"
            min="0"
            class="w-full mt-1 px-3 py-2 text-sm border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30"
          />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-text-muted tracking-wide">RENTAL DURATION *</label>
          <input
            type="number"
            [(ngModel)]="rentalDuration"
            min="1"
            class="w-full mt-1 px-3 py-2 text-sm border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30"
          />
        </div>
        <div>
          <label class="text-xs font-semibold text-text-muted tracking-wide">DURATION UNIT *</label>
          <select
            [(ngModel)]="durationUnit"
            class="w-full mt-1 px-3 py-2 text-sm border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30 bg-white"
          >
            <option value="Day">Daily</option>
            <option value="Week">Weekly</option>
            <option value="Month">Monthly</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-text-muted tracking-wide">NOTES</label>
        <textarea
          [(ngModel)]="notes"
          rows="3"
          placeholder="Any terms or conditions to mention..."
          class="w-full mt-1 px-3 py-2 text-sm border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30"
        ></textarea>
      </div>
    </div>

    <div class="flex justify-end gap-2 p-5 border-t border-border">
      <app-button variant="secondary" (clicked)="onCancel()">Cancel</app-button>
      <app-button variant="primary" [disabled]="isSubmitting" (clicked)="onSubmit()">
        {{ isSubmitting ? 'Starting...' : 'Send Initial Offer' }}
      </app-button>
    </div>
  </div>
</div>
