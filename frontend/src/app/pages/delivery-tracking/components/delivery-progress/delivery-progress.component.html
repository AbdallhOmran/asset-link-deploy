<div class="bg-white rounded-xl border border-slate-200 p-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h3 class="text-xl font-bold text-slate-900">Delivery Progress</h3>

      <p class="text-sm text-slate-500 mt-1">
        DEL-2026-001 • HeavyHaul Logistics
      </p>
    </div>

    <span
      class="px-4 py-2 rounded-full bg-green-100 text-green-700 text-sm font-semibold"
    >
      ● Live Tracking
    </span>
  </div>

  <app-stepper [steps]="deliverySteps" [currentStep]="2"> </app-stepper>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
    <div>
      <p class="text-xs text-slate-400">FROM</p>

      <h5 class="font-semibold text-slate-900">Portland Depot</h5>
    </div>

    <div>
      <p class="text-xs text-slate-400">DRIVER</p>

      <h5 class="font-semibold text-slate-900">Diego Reyes</h5>
    </div>

    <div>
      <p class="text-xs text-slate-400">TO</p>

      <h5 class="font-semibold text-slate-900">Apex Construction Site</h5>
    </div>
  </div>
</div>
