<div class="p-8 bg-slate-50 min-h-screen">
  <div class="mb-8 flex justify-between items-start">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">
        Delivery & Escrow Tracking
      </h1>
      <p class="text-slate-500 text-sm mt-1">
        Real-time delivery progress, escrow breakdown, and release management
        for active rentals.
      </p>
    </div>

    <div class="flex gap-3" *ngIf="selectedDelivery">
      <button
        *ngIf="selectedDelivery.status !== 'Delivered'"
        (click)="updateNextStatus()"
        class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-700"
      >
        Update to: {{ getNextStatusText() }}
      </button>
    </div>
  </div>

  <div class="flex gap-4 mb-6" *ngIf="deliveries.length > 0">
    <button
      *ngFor="let del of deliveries"
      (click)="selectDelivery(del)"
      [class]="
        selectedDelivery?._id === del._id
          ? 'bg-blue-600 text-white border-blue-600'
          : 'bg-white text-slate-600 border-slate-200'
      "
      class="flex items-center px-4 py-2 rounded-full border text-sm font-medium transition-colors"
    >
      <svg
        class="w-4 h-4 mr-2"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M20 8l-8 5-8-5V6l8-5 8 5v2zM4 16v-2l8 5 8-5v2l-8 5-8-5z"
        ></path>
      </svg>
      {{ del.deliveryCode }}
      <span
        [class]="
          selectedDelivery?._id === del._id
            ? 'bg-blue-500 text-white'
            : 'bg-slate-100 text-slate-500'
        "
        class="ml-2 px-2 py-0.5 rounded-full text-xs"
      >
        {{ del.status === "Delivered" ? "Done" : "Live" }}
      </span>
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-6">
      <app-delivery-progress
        [delivery]="selectedDelivery"
        [timeline]="timeline"
      >
      </app-delivery-progress>

      <app-shipment-details [delivery]="selectedDelivery">
      </app-shipment-details>

      <app-delivery-event-log
        [timeline]="timeline"
        [delivery]="selectedDelivery"
      ></app-delivery-event-log>
    </div>

    <div class="lg:col-span-1"></div>
  </div>
</div>
