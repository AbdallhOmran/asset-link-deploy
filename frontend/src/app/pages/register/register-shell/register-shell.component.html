<app-auth-layout>
  <h1 class="text-2xl font-bold text-slate-900 mb-1 tracking-tight">
    Register Company Account
  </h1>
  <p class="text-sm text-slate-500 mb-8">
    Set up your company account in 3 simple steps.
  </p>

  <!-- ✅ fixed: pass stepperIndex (0-based) instead of currentStep (1-based) -->
  <div class="mb-8">
    <app-stepper [steps]="steps" [currentStep]="stepperIndex"></app-stepper>
  </div>

  <div class="bg-white rounded-[16px] p-6 shadow-sm border border-slate-100">
    <router-outlet></router-outlet>
  </div>

  <p class="text-center text-sm text-slate-500 mt-6">
    Already have an account?
    <a routerLink="/login" class="font-semibold text-blue-600 hover:text-blue-700 transition-colors">Log In</a>
  </p>
</app-auth-layout>
