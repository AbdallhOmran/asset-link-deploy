<div class="p-6">
  <h2 class="text-2xl font-bold text-text">Bookings</h2>
  <p class="text-text-muted text-sm mt-1 mb-5">
    Track active, pending, and completed equipment rentals.
  </p>

  <p *ngIf="errorMessage" class="text-sm text-danger bg-danger-bg p-2 rounded-md mb-4">
    {{ errorMessage }}
  </p>

  <div class="flex items-center gap-3 mb-5 flex-wrap">
    <div class="flex bg-page rounded-lg p-1 border border-border">
      <button
        type="button"
        class="px-4 py-1.5 rounded-md text-sm font-medium transition-colors"
        [ngClass]="viewMode === 'list' ? 'bg-primary text-white' : 'text-text-muted'"
        (click)="setViewMode('list')"
      >
        List View
      </button>
      <button
        type="button"
        class="px-4 py-1.5 rounded-md text-sm font-medium transition-colors"
        [ngClass]="viewMode === 'calendar' ? 'bg-primary text-white' : 'text-text-muted'"
        (click)="setViewMode('calendar')"
      >
        Calendar
      </button>
    </div>

    <div class="relative flex-1 min-w-[220px]">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-sm">🔍</span>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (ngModelChange)="applyFilter()"
        placeholder="Search bookings..."
        class="w-full pl-9 pr-3 py-2 text-sm border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30"
      />
    </div>

    <app-button variant="secondary" (clicked)="toggleFilterPanel()">
      <span>☰</span> Filter
    </app-button>
  </div>

  <p *ngIf="isLoading" class="text-sm text-text-muted mb-4">Loading...</p>

  <!-- ===== LIST VIEW ===== -->
  <ng-container *ngIf="viewMode === 'list' && !isLoading">
    <app-data-table
      [columns]="columns"
      [data]="filteredBookings"
      (actionClicked)="onBookingAction($event)"
    ></app-data-table>

    <p *ngIf="filteredBookings.length === 0" class="text-center text-text-muted py-8 text-sm">
      No bookings found.
    </p>
  </ng-container>

  <!-- ===== CALENDAR VIEW ===== -->
  <div *ngIf="viewMode === 'calendar' && !isLoading" class="bg-white border border-border rounded-card p-4">
    <div class="flex items-center justify-between mb-4">
      <button type="button" (click)="prevMonth()" class="px-2 py-1 text-text-muted hover:text-text">‹</button>
      <h3 class="font-semibold text-text">{{ calendarMonthLabel }}</h3>
      <button type="button" (click)="nextMonth()" class="px-2 py-1 text-text-muted hover:text-text">›</button>
    </div>

    <div class="grid grid-cols-7 text-center text-xs font-semibold text-text-muted mb-2">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>

    <div class="grid grid-cols-7 gap-1">
      <div
        *ngFor="let day of calendarDays"
        class="min-h-[80px] rounded-lg p-1.5 border text-xs"
        [ngClass]="{
          'border-border bg-white': day.isCurrentMonth,
          'border-transparent bg-page/50 text-text-muted': !day.isCurrentMonth,
          'border-primary': isToday(day.date)
        }"
      >
        <div class="font-semibold mb-1" [ngClass]="isToday(day.date) ? 'text-primary' : ''">
          {{ day.date.getDate() }}
        </div>
        <div
          *ngFor="let booking of day.bookings.slice(0, 2)"
          class="bg-primary/10 text-primary rounded px-1 py-0.5 mb-0.5 truncate"
          [title]="booking.assetName + ' · ' + booking.bookingCode"
        >
          {{ booking.bookingCode }}
        </div>
        <div *ngIf="day.bookings.length > 2" class="text-text-muted">
          +{{ day.bookings.length - 2 }} more
        </div>
      </div>
    </div>
  </div>
</div>
