<header class="h-20 bg-white border-b border-slate-200 px-8 flex items-center justify-between">

  <!-- Left -->
  <div class="flex items-center gap-2 text-sm">

    <span class="text-slate-400">
      Platform
    </span>

    <span class="text-slate-300">
      >
    </span>

    <span class="font-semibold text-slate-900">
      {{ pageTitle }}
    </span>

  </div>

  <!-- Right -->
  <div class="flex items-center gap-4">

    <!-- Search -->
    <div class="relative">

      <input
        type="text"
        placeholder="Quick search..."
        class="w-72 h-11 rounded-xl border border-slate-200 bg-slate-50 pl-11 pr-4 outline-none focus:border-blue-500 focus:bg-white transition"
      />

      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2">

        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.5-3.5"/>

      </svg>

    </div>

    <!-- Notification -->
    <!-- <button
      class="relative w-11 h-11 rounded-full border border-slate-200 flex items-center justify-center hover:bg-slate-100 transition">

      🔔

      <span
        class="absolute top-3 right-3 w-2 h-2 bg-red-500 rounded-full">
      </span>

    </button> -->

    <!-- Avatar -->
    <div
  class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition"
  routerLink="/app/company-profile"
>
 <div
  class="w-11 h-11 rounded-full overflow-hidden bg-sky-500 flex items-center justify-center">

  <img
    *ngIf="companyLogo"
    [src]="companyLogo"
    [alt]="companyName"
    class="w-full h-full object-cover">

  <span *ngIf="!companyLogo" class="text-white font-semibold">
    {{ initials }}
  </span>

</div>

<div class="font-medium text-slate-800">
  {{ companyName }}
</div>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="w-4 h-4 text-slate-500"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2">
    <path d="m6 9 6 6 6-6"/>
  </svg>
</div>

  </div>

</header>
